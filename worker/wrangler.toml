name = "meu-push"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Origine autorisée à appeler ce Worker (ton site déployé).
[vars]
ALLOWED_ORIGIN = "https://meu-app-virid-kappa.vercel.app"
GITHUB_OWNER = "seydouhanne"
GITHUB_REPO = "meu-app"

# Créée avec : wrangler kv namespace create PUSH_SUBS
# Remplace "id" par l'ID retourné par la commande.
kv_namespaces = [
  { binding = "PUSH_SUBS", id = "e96d4a16fed6407ea0ac817cd7cf81cf" }
]

# Secrets (jamais dans ce fichier) — voir DEPLOY.md :
#   wrangler secret put GITHUB_TOKEN     (le PAT GitHub, portée "repo" uniquement)
#   wrangler secret put USER1_HASH       (hash par défaut, généré par l'écran Setup)
#   wrangler secret put USER2_HASH
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put APP_SECRET
